# Team colors, logos and notes. Teams are matched by name, so a team that changed
# its name gets its own entry. Teams not listed here get default colors and the
# logo from MyFantasyLeague.
#
#   colors.primary   -> jersey, helmet and socks on the team page player
#   colors.secondary -> pants, numbers and trim
#   logo             -> optional; replaces the MyFantasyLeague logo
#   aliases          -> other spellings that should count as the same team

teams:
  - name: Black Mamba
    colors: { primary: "#1c1c1c", secondary: "#e3b53b" }
    jersey: "20"
  - name: Samurai Champloo
